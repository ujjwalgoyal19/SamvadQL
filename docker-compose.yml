version: '3.9'
services:
  # Frontend
  frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-mta}_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
      - '${HMR_PORT:-24678}:24678' # Vite HMR port
    volumes:
      - ./apps/web-frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
      - VITE_HMR_PORT=${VITE_HMR_PORT}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - samvadql-network
    stdin_open: true
    tty: true

  # Documentation
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile.dev
    ports:
      - '3001:3000'
    volumes:
      - ./docs:/app
      - ./backend:/source/backend:ro
      - ./frontend:/source/frontend:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - samvadql-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=samvadql
      - POSTGRES_USER=samvadql
      - POSTGRES_PASSWORD=password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - samvadql-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - samvadql-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - samvadql-network

  # OpenSearch (Alternative vector database)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - samvadql-network

  # Backend API
  backend:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile.dev
    ports:
      - '8000:8000'
      - '5679:5679' # For debugger
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - DEBUG_MODE=debug
      - DATABASE_URL=postgresql://samvadql:password@postgres:5432/samvadql
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./apps/api-backend:/app
    command:
      [
        'sh',
        '-c',
        'python -m debugpy --wait-for-client --listen 0.0.0.0:5679 -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload'
      ]
    networks:
      - samvadql-network

  # Background Job Worker
  worker:
    image: ${COMPOSE_PROJECT_NAME:-samvadql}_backend
    environment:
      - DATABASE_URL=postgresql://samvadql:password@postgres:5432/samvadql
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
    depends_on:
      - backend
      - postgres
      - redis
      - qdrant
    volumes:
      - ./apps/api-backend:/app
    command: celery -A worker worker --loglevel=info
    networks:
      - samvadql-network

  # Celery Beat Scheduler
  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-samvadql}_backend
    environment:
      - DATABASE_URL=postgresql://samvadql:password@postgres:5432/samvadql
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - postgres
      - redis
    volumes:
      - ./apps/api-backend:/app
    command: celery -A worker beat --loglevel=info
    networks:
      - samvadql-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  opensearch_data:
  frontend_node_modules:

networks:
  samvadql-network:
    driver: bridge
