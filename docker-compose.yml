version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: samvadql_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=samvadql
      - POSTGRES_USER=samvadql
      - POSTGRES_PASSWORD=password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U samvadql']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvadql-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: samvadql_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvadql-network

volumes:
  postgres_data:
  redis_data:

networks:
  samvadql-network:
    driver: bridge
