[tool.poetry]
name = "samvadql-api"
version = "1.0.0"
description = "SamvadQL API - Semantic Query Answering with Natural Language"
authors = ["SamvadQL Team"]
readme = "README.md"
packages = [{include = "api"}, {include = "core"}, {include = "models"}, {include = "repositories"}, {include = "services"}, {include = "utils"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core FastAPI and async dependencies
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
gunicorn = "^21.2.0"

# Database connectivity
asyncpg = "^0.29.0"
aiomysql = "^0.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
alembic = "^1.12.1"

# SQL processing and validation
sqlglot = "^20.1.0"
sqlfluff = "^2.3.5"

# Caching
redis = {extras = ["hiredis"], version = "^5.0.1"}

# Authentication and security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
argon2-cffi = "^25.1.0"
python-multipart = "^0.0.6"
email-validator = "^2.2.0"

# Monitoring and logging
structlog = "^23.2.0"
prometheus-client = "^0.19.0"

# LangChain and LLM providers
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
langchain-anthropic = "^0.0.1"
langchain-community = "^0.0.10"
langchain-core = "^0.1.0"
langchain-experimental = "^0.0.49"

# Vector database (Pinecone)
pinecone-client = "^7.0.0"

# Embeddings
sentence-transformers = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
httpx = "^0.25.2"
ruff = "^0.1.9"
mypy = "^1.7.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
